# XcodeGen spec. Generate the Xcode project on a Mac with: `xcodegen generate`
name: GymProgress
options:
  bundleIdPrefix: com.gymprogress
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es-AR
  createIntermediateGroups: true

settings:
  base:
    # Working name of the app: change it only here.
    APP_DISPLAY_NAME: GymProgress
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GymCore:
    path: GymCore

targets:
  GymProgress:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GymCore
        product: GymCore
      - package: GymCore
        product: GymStore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: es-AR
        CFBundleLocalizations: [es-AR]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymprogress.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  GymProgressTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: GymProgress
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GymProgress.app/GymProgress

schemes:
  GymProgress:
    build:
      targets:
        GymProgress: all
    test:
      targets:
        - GymProgressTests
      gatherCoverageData: true

# XcodeGen spec. Generate the Xcode project with: `xcodegen generate`
name: GymProgress
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es-AR
  createIntermediateGroups: true

settings:
  base:
    # ---- Change the app's identity only here --------------------------------------------
    APP_DISPLAY_NAME: GymProgress
    BUNDLE_ID: com.example.gymprogress
    # -------------------------------------------------------------------------------------
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""

packages:
  GymCore:
    path: GymCore

targets:
  GymProgress:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: GymCore
        product: GymCore
      - package: GymCore
        product: GymStore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: es-AR
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [es-AR]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: GymProgress
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  GymProgressTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: GymProgress
      - package: GymCore
        product: GymCore
      - package: GymCore
        product: GymStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GymProgress.app/GymProgress

schemes:
  GymProgress:
    build:
      targets:
        GymProgress: all
        GymProgressTests: [test]
    test:
      targets:
        - GymProgressTests
      gatherCoverageData: false

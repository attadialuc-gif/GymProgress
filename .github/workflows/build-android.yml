name: build-android

# Release APK signed with the project key (GitHub secrets; never in the repository).
on:
  push:
    paths:
      - "crossplatform/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            crossplatform/app/android/*.gradle*
            crossplatform/app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Release signing key (from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > crossplatform/app/android/key.properties
      - name: Build release APK
        working-directory: crossplatform/app
        env:
          GYM_REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set -o pipefail
          flutter pub get
          flutter build apk --release 2>&1 | tee ../../build-android.log
      - name: Verify signature (project key, never the debug key)
        run: |
          set -eu
          APK=crossplatform/app/build/app/outputs/flutter-apk/app-release.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.log
          grep -q "CN=GymProgress" apk-signature.log
          if grep -qi "Android Debug" apk-signature.log; then echo "::error::Debug-signed APK"; exit 1; fi
          mkdir -p out
          cp "$APK" out/GymProgress.apk
          (cd out && sha256sum GymProgress.apk > GymProgress.apk.sha256 && cat GymProgress.apk.sha256)
          ls -la out
      - name: Remove signing material
        if: always()
        run: rm -f crossplatform/app/android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: GymProgress-android
          path: out/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-logs
          path: |
            build-android.log
            apk-signature.log
          if-no-files-found: ignore

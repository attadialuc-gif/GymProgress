name: test

# Dart/Flutter port (crossplatform/): unit tests against the Swift fixtures on every push.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Toolchain
        run: flutter --version
      - name: gym_core (engine, metrics, calendar vs. Swift fixtures)
        working-directory: crossplatform/gym_core
        run: |
          set -o pipefail
          dart pub get
          dart analyze --fatal-infos
          dart test -r expanded 2>&1 | tee ../../gym_core-test.log
      - name: gym_store (persistence, services, store scenarios)
        working-directory: crossplatform/gym_store
        run: |
          set -o pipefail
          dart pub get
          dart analyze --fatal-infos
          dart test -r expanded 2>&1 | tee ../../gym_store-test.log
      - name: app (widget tests)
        working-directory: crossplatform/app
        run: |
          set -o pipefail
          flutter pub get
          flutter analyze
          flutter test -r expanded 2>&1 | tee ../../app-test.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: "*-test.log"
          if-no-files-found: ignore

  # The 2.E flow (UI + real SQLite file + app reload) on a real Windows desktop build.
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Integration test 2.E (Windows)
        working-directory: crossplatform/app
        shell: bash
        run: |
          set -o pipefail
          flutter config --enable-windows-desktop
          flutter pub get
          flutter test integration_test -d windows -r expanded 2>&1 | tee ../../windows-integration.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-log
          path: windows-integration.log
          if-no-files-found: ignore

  # The same 2.E flow on an Android emulator (API 34, x86_64, KVM).
  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            crossplatform/app/android/*.gradle*
            crossplatform/app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test 2.E (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: crossplatform/app
          # pipefail: a failing test must fail the job even though the output goes through tee.
          script: bash -c 'set -o pipefail; flutter test integration_test -d emulator-5554 -r expanded 2>&1 | tee ../../android-integration.log'
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-log
          path: android-integration.log
          if-no-files-found: ignore

  # The fixtures are generated from the Swift implementation; they must match what the Swift
  # code produces today (export_from_swift.json uses random ids and is checked by import instead).
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Regenerate fixtures
        working-directory: GymCore
        run: swift run -c debug FixtureExporter export "$RUNNER_TEMP/fixtures"
      - name: Compare with committed fixtures
        run: |
          python3 - "$RUNNER_TEMP/fixtures" crossplatform/fixtures <<'EOF'
          import json, os, sys
          fresh, committed = sys.argv[1], sys.argv[2]
          names = sorted(set(os.listdir(fresh)) | set(os.listdir(committed)))
          bad = [n for n in names if n != "export_from_swift.json"
                 and (not os.path.exists(os.path.join(fresh, n)) or not os.path.exists(os.path.join(committed, n))
                      or json.load(open(os.path.join(fresh, n))) != json.load(open(os.path.join(committed, n))))]
          print("stale fixtures:", bad) if bad else print("Fixtures are up to date.")
          sys.exit(1 if bad else 0)
          EOF
      - name: Swift export imports in Swift
        working-directory: GymCore
        run: swift run -c debug FixtureExporter verify-import "$RUNNER_TEMP/fixtures/export_from_swift.json"
